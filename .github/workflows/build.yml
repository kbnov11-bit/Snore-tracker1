name: Build APK from Zip

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Project
        run: |
         unzip -o SnoreTracker-Android.zip
         chmod +x SnoreTracker-Android/gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: SnoreTracker-Android
          arguments: assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnoreTracker-APK
          path: SnoreTracker-Android/app/build/outputs/apk/debug/*.apk
